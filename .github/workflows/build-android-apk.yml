name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Validate Supabase build secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          missing=()
          if [ -z "$SUPABASE_URL" ]; then
            missing+=("SUPABASE_URL")
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            missing+=("SUPABASE_ANON_KEY")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Missing Supabase secrets::Set repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          mkdir -p build/artifacts
          cp build/app/outputs/flutter-apk/app-debug.apk \
            build/artifacts/maskan-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: maskan-debug-apk
          path: build/artifacts/maskan-debug.apk
          if-no-files-found: error

      - name: Build Supabase debug APK
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          mkdir -p build/artifacts
          cp build/app/outputs/flutter-apk/app-debug.apk \
            build/artifacts/maskan-supabase-debug.apk

      - name: Upload Supabase debug APK
        uses: actions/upload-artifact@v4
        with:
          name: maskan-supabase-debug-apk
          path: build/artifacts/maskan-supabase-debug.apk
          if-no-files-found: warn

      - name: Check Android signing secrets
        id: android_signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && \
             [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && \
             [ -n "$ANDROID_KEY_ALIAS" ] && \
             [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Signed release APK skipped::Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD to build the signed release APK."
          fi

      - name: Prepare Android release keystore
        if: steps.android_signing.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/android-signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/upload-keystore.jks"

      - name: Build signed release APK
        if: steps.android_signing.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/android-signing/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          mkdir -p build/artifacts
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/artifacts/Maskan.apk

      - name: Upload signed release APK
        if: steps.android_signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: maskan-release-signed-apk
          path: build/artifacts/Maskan.apk
          if-no-files-found: error

      - name: Build signed release App Bundle
        if: steps.android_signing.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/android-signing/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          mkdir -p build/artifacts
          cp build/app/outputs/bundle/release/app-release.aab \
            build/artifacts/maskan-release-signed.aab

      - name: Upload signed release App Bundle
        if: steps.android_signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: maskan-release-signed-aab
          path: build/artifacts/maskan-release-signed.aab
          if-no-files-found: error
